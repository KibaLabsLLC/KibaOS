# A KibaOS session (XDG_CURRENT_DESKTOP=KibaOS). Ash answers whether the
# desktop is light or dark and what its accent is, and its file chooser,
# KibaOS Files, is the one an application asking the portal for a file
# gets; GTK's backend answers the rest, and fills in any setting Ash does
# not have.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=kibaos;gtk
org.freedesktop.impl.portal.FileChooser=kibaos
