# KibaOS feature toggles for chromiumos-ash.
#
# Expose system-level Linux volumes such as /, /home, /mnt, /opt, and
# /usr/local in the Files app. Common user directories are shown regardless.
KIBAOS_EXPOSE_SYSTEM_VOLUMES=0

# Disable Chrome's process sandboxes. Keep this disabled for daily use; set it
# only for constrained test environments that cannot launch sandboxed Chrome.
KIBAOS_DISABLE_SANDBOX=0

# Ozone platform for Ash. Leave empty to auto-select Wayland when
# WAYLAND_DISPLAY is present, otherwise X11. Set to drm for direct-KMS tests.
KIBAOS_OZONE_PLATFORM=

# Developer-only OOBE bypass for local smoke tests. Do not enable in packaged
# daily-driver sessions; real setup, EULA, and consent screens must be shown.
KIBAOS_DEV_STUB_OOBE=0

# Show the KibaOS local-account setup card in OOBE. This is enabled for
# packaged KibaOS sessions and does not bypass legal or consent screens.
KIBAOS_ENABLE_LOCAL_ACCOUNTS=1

# Optional Ash host window bounds, for nested compositor or VM sessions where
# Ash cannot infer the real output size. Leave empty for normal hardware.
# Example: KIBAOS_ASH_HOST_WINDOW_BOUNDS=1280x800
KIBAOS_ASH_HOST_WINDOW_BOUNDS=

# Disable the automatic ChromeVox idle hint timer. The accessibility settings
# screen remains available, but the auto prompt depends on ChromeOS TTS assets
# that are not always present in Linux packages and can block OOBE input.
KIBAOS_DISABLE_CHROMEVOX_HINT_TIMER=1

# KibaOS runs ChromeOS display code on generic Linux graphics stacks. Keep the
# session alive if GPU output-surface creation fails and let Chromium disable
# GPU compositing instead of killing the shell.
KIBAOS_ALLOW_GPU_COMPOSITING_FALLBACK=1

# The wallpaper Ash shows until another is picked, and takes the desktop's
# colours from, for example /usr/share/kibaos/wallpapers/quiet-rainleaves.png.
# Leave empty for the KibaOS gradient, or in the Plus profiles ChromeOS's time
# of day wallpaper, which a wallpaper named here replaces.
KIBAOS_DEFAULT_WALLPAPER=

# Feature profile override. Leave empty for automatic standard/plus selection.
# Advanced Plus AI only downloads a model when the optional kibaos-ai package is
# installed and this profile is active.
# Example: KIBAOS_FEATURE_PROFILE=advanced_plus_ai
KIBAOS_FEATURE_PROFILE=

# Optional Advanced Plus AI bootstrap controls. These do nothing unless
# KIBAOS_FEATURE_PROFILE=advanced_plus_ai and /usr/bin/kibaos-ai-bootstrap is
# installed by the optional kibaos-ai package.
KIBAOS_LOCAL_AI_BOOTSTRAP=1
KIBAOS_LOCAL_AI_AUTO_DOWNLOAD=1

# Android apps (Waydroid-based, through the kibaos-android package). "auto"
# turns the Android settings page on when that package is installed; Android
# itself stays off until you turn it on in Settings. 0 hides it, 1 forces it.
KIBAOS_ANDROID=auto

# Developer-only: Chrome's DevTools port on 127.0.0.1, which the smoke tests
# drive. It needs no password, so anything running on the machine, as any
# account, could take over the desktop and read every site's sign-ins. Never
# enable it on a machine somebody uses.
KIBAOS_ENABLE_DEVTOOLS_PORT=0
