name: Delete all tags

# Temporary: the OTA tag system is gone, so leftover `ota-patch-*` tags are
# removed with this manual job. Delete this workflow once the tags are gone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-tags:
    name: Delete every tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete tags
        run: |
          set -euo pipefail
          mapfile -t tags < <(git ls-remote --tags origin | sed 's|.*refs/tags/||' | grep -v '\^{}$' || true)
          echo "Found ${#tags[@]} tags."
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "Nothing to delete."
            exit 0
          fi
          printf '%s\n' "${tags[@]}" | xargs -r -n 40 git push origin --delete

      - name: Verify no tags remain
        run: |
          set -euo pipefail
          remaining=$(git ls-remote --tags origin | sed 's|.*refs/tags/||' | grep -v '\^{}$' | wc -l)
          echo "Remaining tags: ${remaining}"
          test "${remaining}" -eq 0
