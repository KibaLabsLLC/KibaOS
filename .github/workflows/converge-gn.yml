name: Converge GN evaluation

on:
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: "Chromium mirror ref (defaults to pins/chromium.sha)"
        required: false
        default: ""
      pr_branch:
        description: "Branch for the convergence PR"
        required: false
        default: "vibe/gn-convergence"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-pruned-gn
  cancel-in-progress: false

jobs:
  converge:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 150
    steps:
      - name: Checkout KibaOS
        uses: actions/checkout@v4

      - name: Checkout Lumen
        uses: actions/checkout@v4
        with:
          repository: KibaLabsLLC/Lumen
          path: lumen

      - name: Resolve chromium ref
        run: |
          ref="${{ inputs.chromium_ref }}"
          if [ -z "$ref" ]; then
            ref="$(tr -d '[:space:]' < pins/chromium.sha)"
          fi
          echo "CHROMIUM_REF=$ref" >> "$GITHUB_ENV"

      - name: Fetch chromium mirror
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/chromium/chromium.git chromium-mirror
          git -C chromium-mirror fetch --depth 1 origin "$CHROMIUM_REF"

      - name: Apply patch series onto Lumen
        working-directory: lumen
        run: |
          while IFS= read -r patch; do
            [ -z "$patch" ] && continue
            case "$patch" in \#*) continue ;; esac
            git apply --whitespace=nowarn ../patches/"$patch"
          done < ../patches/SERIES
          git add -A
          git diff --cached --quiet || \
            git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "series state (diff anchor)"

      - name: Repair and validate
        run: |
          python3 ci/repair-pruned-gn.py \
            --lumen lumen \
            --chromium chromium-mirror \
            --ref "$CHROMIUM_REF" \
            --out repaired

      - name: Bootstrap depot_tools
        run: |
          if [ ! -d depot_tools/.git ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              depot_tools
          fi
          export DEPOT_TOOLS_UPDATE=0
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"
          "$PWD/depot_tools/cipd" --version

      - name: Sync DEPS
        run: |
          ln -sfn lumen src
          python3 ci/resolve-deps.py \
            --root . \
            --target-os linux \
            --target-cpu x64 \
            --jobs 8 \
            --var checkout_telemetry_dependencies=False \
            --var checkout_pgo_profiles=False \
            --var checkout_nacl=False \
            --var checkout_android=False \
            --skip-dep-path 'src/third_party/angle/src/tests/restricted_traces' \
            --skip-hook-action 'chromite/bin/cros' \
            --skip-hook-action 'chrome/' \
            --skip-hook-name 'Generate location tags for tests'

      - name: Verify the DEPS-provided gn
        run: |
          gn_bin="lumen/buildtools/linux64/gn"
          if [ ! -x "$gn_bin" ]; then
            echo "gn was not materialized by the DEPS sync" >&2
            exit 1
          fi
          "$gn_bin" --version

      - name: Converge gn gen
        run: |
          python3 ci/converge-gn.py \
            --lumen lumen \
            --gn "$PWD/lumen/buildtools/linux64/gn" \
            --chromium chromium-mirror \
            --ref "$CHROMIUM_REF" \
            --out-dir out/Ash

      - name: Clean build outputs
        run: rm -rf lumen/out

      - name: Emit convergence patch
        working-directory: lumen
        if: success()
        run: |
          mkdir -p ../repaired
          if [ -z "$(find ../repaired -type f | head -1)" ] && \
             [ -z "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Nothing converged beyond the current series" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -u
          rsync -a ../repaired/ .
          if [ -n "$(find ../repaired -type f -print -quit)" ]; then
            (cd ../repaired && find . -type f -printf '%P\n') | \
              xargs -r -d '\n' git add --
          fi
          git diff --cached HEAD > ../patches/0900-gn-evaluation-converges.patch
          grep -q '^0900-gn-evaluation-converges.patch$' ../patches/SERIES || \
            printf '0900-gn-evaluation-converges.patch\n' >> ../patches/SERIES

      - name: Commit and push
        if: success()
        run: |
          branch="${{ inputs.pr_branch }}"
          if [ -z "$branch" ]; then
            branch="vibe/gn-convergence"
          fi
          if [ "$branch" = "main" ]; then
            echo "Refusing to push the convergence onto main" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --heads origin "$branch" | grep -q "$branch"; then
            git fetch origin "$branch"
            git checkout "$branch"
          else
            git checkout -b "$branch"
          fi
          if [ -f patches/0900-gn-evaluation-converges.patch ]; then
            git add patches/0900-gn-evaluation-converges.patch patches/SERIES
          else
            echo "No convergence patch to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Converge gn evaluation with the real binary"
          git push origin "$branch"

      - name: Open PR
        if: success()
        run: |
          branch="${{ inputs.pr_branch }}"
          [ -z "$branch" ] && branch="vibe/gn-convergence"
          n="$(gh pr list --head "$branch" --state open --json number -q 'length')"
          if [ "$n" != "0" ]; then
            echo "PR already open"
            exit 0
          fi
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary
          - Adds `ci/converge-gn.py` plus a `workflow_dispatch` workflow that runs the real `gn gen` (built from `tools/gn` at the pins sha) on the series-patched Lumen checkout with the ash package's argument block
          - Missing evaluation-time files (`import()`/`exec_script`/`read_file` inputs the pruner deleted) are restored from the chromium mirror; dep edges into build files the pruner deleted (anything under `chrome/` included), refs to targets the pruner dropped (gn's "Unresolved dependencies" pairs), duplicate source listings that collide into one object file, and input refs nothing generates are cut in the referrer gn names, while inputs whose generators lack a dep path get those generators added as deps (gn's own `gn edit add deps` suggestion), so the browser is never restored nor loaded — retried until `gn gen` converges (bounded at 1000 attempts, `--max-iterations` overrides)
          - Failures that are none of those (undefined identifiers, emptied sources) stop the loop with the full gn log; the converged fixes are emitted as `patches/0900-gn-evaluation-converges.patch`

          ## Verification
          - Trigger with: `gh workflow run converge-gn.yml --ref <branch>`
          EOF
          gh pr create --draft --head "$branch" \
            --title "Converge gn evaluation with the real binary" \
            --body-file /tmp/pr-body.md
        env:
          GH_TOKEN: ${{ github.token }}
