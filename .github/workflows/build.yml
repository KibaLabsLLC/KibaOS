name: "Build KibaOS"
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the "Prune older ccache entries" step delete stale caches

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            compiler: clang
            config: Debug
            ntver: '0xA00'
          - arch: arm64
            compiler: clang
            config: Debug
            ntver: '0xA00'
            profile: profile_raspberry
    # Both architectures build on x86_64: the RosBE toolchain cross-compiles
    # amd64 and arm64 targets, so there is no native-arm64 runner or Docker
    # layer any more.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: false
          remove_swap: true

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar \
            python3-mako python3-yaml python3-packaging glslang-tools msitools \
            sshpass rsync

      - name: Compute RosBE bootstrap SHA
        id: rosbe_spec
        run: |
          curl -fsSL https://raw.githubusercontent.com/ahmedarif193/winget-rosbe/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
          echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache RosBE
        id: cache_rosbe
        uses: actions/cache@v5
        with:
          path: ~/.local/opt/rosbe
          key: rosbe-${{ runner.os }}-${{ steps.rosbe_spec.outputs.sha }}

      - name: Install RosBE
        if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
        run: sh /tmp/rosbe-bootstrap.sh

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.ntver }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.ntver }}-

      - name: Set ccache settings
        run: |
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

      - name: Cache Mesa LLVM
        id: cache_llvm
        if: ${{ matrix.compiler == 'clang' && (matrix.arch == 'amd64' || matrix.arch == 'arm64') }}
        uses: actions/cache@v5
        with:
          path: ~/mesa-llvm
          key: mesa-llvm-22.1.8-${{ matrix.arch }}-${{ steps.rosbe_spec.outputs.sha }}-${{ hashFiles('submodules/mesa-llvmpipe.cmake', 'submodules/llvm-*.patch', 'submodules/mesa-llvm-extract.py', 'submodules/reactos-sdk.cmake', 'submodules/reactos-sdk-flags.cmake') }}

      - name: Configure
        id: configure
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          FLAGS=""
          [ "${{ matrix.compiler }}" = "clang" ] && FLAGS="$FLAGS --clang"
          [ "${{ matrix.compiler }}" = "gcc" ] && FLAGS="$FLAGS --gcc"
          [ "${{ matrix.config }}" = "Release" ] && FLAGS="$FLAGS -r"
          [ -n "${{ matrix.profile }}" ] && FLAGS="$FLAGS -DROSCONFIG_PROFILE=${{ matrix.profile }}"
          [ "${{ matrix.compiler }}" = "clang" ] && case "${{ matrix.arch }}" in amd64|arm64) FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON" ;; esac
          if [ "${{ steps.cache_llvm.outputs.cache-hit }}" = "true" ]; then
            FLAGS="$FLAGS -DMESA_LLVM_ROOT=$HOME/mesa-llvm/native -DMESA_LLVM_LICENSE_FILE=$HOME/mesa-llvm/LICENSE.TXT"
            [ -d "$HOME/mesa-llvm/arm64ec" ] && FLAGS="$FLAGS -DMESA_ARM64EC_LLVM_ROOT=$HOME/mesa-llvm/arm64ec -DMESA_ARM64EC_LLVM_LICENSE_FILE=$HOME/mesa-llvm/LICENSE.TXT"
          fi
          ./configure.sh $FLAGS -a ${{ matrix.arch }} \
            -DREACTOS_TARGET_NT=${{ matrix.ntver }} \
            -DDIAGDATA_CHANNEL= \
            -DENABLE_CCACHE=1
          ENV_NAME=$([ "${{ matrix.compiler }}" = "clang" ] && echo Clang || echo GCC)
          CFG_LOWER=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
          echo "outdir=output-$ENV_NAME-${{ matrix.arch }}-$CFG_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build submodules
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C ${{ steps.configure.outputs.outdir }} submodules

      - name: Keep Mesa LLVM for the cache
        if: ${{ steps.cache_llvm.outcome == 'success' && steps.cache_llvm.outputs.cache-hit != 'true' }}
        run: |
          OUT=${{ steps.configure.outputs.outdir }}
          mkdir -p ~/mesa-llvm
          cp -R "$OUT/submodules/mesa-llvmpipe/llvm-install" ~/mesa-llvm/native
          cp "$OUT/submodules/mesa-llvmpipe/llvm-source/llvm/LICENSE.TXT" ~/mesa-llvm/LICENSE.TXT
          if [ -d "$OUT/_fex_arm64ec/submodules/mesa-llvmpipe/llvm-install" ]; then
            cp -R "$OUT/_fex_arm64ec/submodules/mesa-llvmpipe/llvm-install" ~/mesa-llvm/arm64ec
          fi

      # bootcd.iso, KibaOS.img and KibaOS.vhd -- the same three targets the
      # install guide documents.
      - name: Build images
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C ${{ steps.configure.outputs.outdir }} bootcd kibaosimg kibaosvhd -k0

      - name: Print ccache statistics
        if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
        run: ccache -s

      - name: Save ccache
        id: ccache_save
        if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

      - name: Prune older ccache entries
        if: ${{ always() && steps.ccache_save.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY_PREFIX: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ matrix.config }}-${{ matrix.ntver }}-
          CACHE_KEY_KEEP: ${{ steps.ccache_restore.outputs.cache-primary-key }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY_PREFIX" --limit 100 --json id,key \
            --jq '.[] | select(.key != env.CACHE_KEY_KEEP) | .id' |
          while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      # ── Stage release files ───────────────────────────────────────────────
      # The ISO goes up as-is. The preinstalled disk images are mostly empty
      # space, so they are xz-compressed before upload (decompress to get
      # KibaOS.img / KibaOS.vhd). Every file gets its own .sha256.
      - name: Stage release files
        run: |
          OUT=${{ steps.configure.outputs.outdir }}
          BASE="kibaos-v${{ github.run_number }}-${{ matrix.arch }}"
          mkdir -p dist
          cp "$OUT/bootcd.iso" "dist/${BASE}.iso"
          xz -T0 -c "$OUT/KibaOS.img" > "dist/${BASE}.img.xz"
          xz -T0 -c "$OUT/KibaOS.vhd" > "dist/${BASE}.vhd.xz"
          cd dist
          for f in "${BASE}.iso" "${BASE}.img.xz" "${BASE}.vhd.xz"; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kibaos-${{ matrix.arch }}-v${{ github.run_number }}
          path: dist/
          compression-level: 0
          retention-days: 14

      # ── SourceForge: upload immediately, replacing the previous build ─────
      # Same scheme as before: a marker file on the server records the run
      # number of the last successful upload for this arch, and ONLY the exact
      # filenames derived from that marker are deleted -- never a glob. With
      # no marker, nothing is deleted.
      - name: Upload to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          ARCH="${{ matrix.arch }}"
          PARENT="/home/frs/project/kibaos"
          REMOTE_DIR="${PARENT}/${ARCH}"
          MARKER="last-build-number-${ARCH}.txt"

          # Make sure the arch directory exists (errors if it already does; ignored).
          printf '%s\n' "cd ${PARENT}" "mkdir ${ARCH}" "bye" \
            | sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no \
                "$SF_USER@frs.sourceforge.net" >/dev/null 2>&1 || true

          # Fetch the previous run's marker, if any.
          rm -f "${MARKER}"
          sshpass -e rsync -avP \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}" \
            "${MARKER}" 2>/dev/null || true

          if [ -s "${MARKER}" ]; then
            PREV_NUM="$(cat "${MARKER}")"
            PREV="kibaos-v${PREV_NUM}-${ARCH}"
            echo "Removing previous ${ARCH} build: ${PREV}.*"
            printf '%s\n' \
              "cd ${REMOTE_DIR}" \
              "rm ${PREV}.iso" \
              "rm ${PREV}.iso.sha256" \
              "rm ${PREV}.img.xz" \
              "rm ${PREV}.img.xz.sha256" \
              "rm ${PREV}.vhd.xz" \
              "rm ${PREV}.vhd.xz.sha256" \
              "bye" \
              | sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no \
                  "$SF_USER@frs.sourceforge.net" 2>/dev/null || true
          else
            echo "No previous build marker for ${ARCH} -- nothing to delete."
          fi

          # Upload this build.
          sshpass -e rsync -avP --progress dist/* \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/"

          # Record this run's number for next time.
          echo "${{ github.run_number }}" > "${MARKER}"
          sshpass -e rsync -avP "${MARKER}" \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}"
